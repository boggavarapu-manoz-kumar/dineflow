spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:dineflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

management:
  health:
    redis:
      enabled: false

dineflow:
  cors:
    allowed-origins: http://localhost:5173
  app:
    name: DineFlow Test
    version: 1.0.0
    environment: test
