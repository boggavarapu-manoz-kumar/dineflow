version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dineflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dineflow_db}
      POSTGRES_USER: ${DB_USER:-dineflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dineflow_secure_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dineflow_user} -d ${DB_NAME:-dineflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dineflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dineflow-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dineflow_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dineflow_minio_secret_123}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
